<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full Feature Plan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3eee4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5f45'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23f3eee4' text-anchor='middle'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eee4; --paper:#fbf8f2; --paper-2:#f6f1e7; --ink:#1d2a24; --ink-2:#5b6661; --ink-3:#8b938e;
  --line:#e3dbcc; --rule:rgba(31,95,69,.055);
  --accent:#1f5f45; --accent-soft:#e2ede6; --accent-2:#c2622d; --accent-2-soft:#f6e6da;
  --good:#2e7d4f; --warn:#a86b00; --warn-soft:#fbefd6; --bad:#b23b2e; --bad-soft:#f7e1dd;
  --shadow:0 1px 0 rgba(29,42,36,.04),0 8px 24px -12px rgba(29,42,36,.18);
  --r:14px;
  --f-display:'Fraunces',Georgia,serif; --f-body:'Instrument Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --paper:#18201c; --paper-2:#1d2621; --ink:#ece6d9; --ink-2:#a3aca6; --ink-3:#6f7a74;
    --line:#2a3530; --rule:rgba(95,180,138,.05);
    --accent:#62b68c; --accent-soft:#1f3329; --accent-2:#e38b57; --accent-2-soft:#3a271c;
    --good:#62b68c; --warn:#e0a83a; --warn-soft:#3a2f17; --bad:#e2766a; --bad-soft:#3b211d;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --paper:#18201c; --paper-2:#1d2621; --ink:#ece6d9; --ink-2:#a3aca6; --ink-3:#6f7a74;
  --line:#2a3530; --rule:rgba(95,180,138,.05);
  --accent:#62b68c; --accent-soft:#1f3329; --accent-2:#e38b57; --accent-2-soft:#3a271c;
  --good:#62b68c; --warn:#e0a83a; --warn-soft:#3a2f17; --bad:#e2766a; --bad-soft:#3b211d;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  color:var(--ink); font:15px/1.5 var(--f-body); -webkit-font-smoothing:antialiased;
  min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
@media (min-width:821px){body{padding-bottom:40px}}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--accent)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:600 22px/1 var(--f-display);margin:0;letter-spacing:-.02em;white-space:nowrap}
.brand h1 em{font-style:italic;color:var(--accent);font-weight:400}
.brand small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:14px}
.tabs button[aria-current="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top-actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync[data-s="saving"] i{background:var(--warn);animation:pulse 1s infinite}
.sync[data-s="error"] i{background:var(--bad)}
.sync[data-s="error"]{color:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:820px){
  .tabs{display:none}
  .brand small{display:none}
  .top-actions{margin-left:auto}
  .top .addTop{display:none}
}

/* ---------- bottom nav (mobile) ---------- */
.bnav{display:none}
@media (max-width:820px){
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);padding:4px 0;cursor:pointer}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="true"]{color:var(--accent);font-weight:600}
}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:22px 16px 40px}
.view{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:1.35fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g-hero,.g-2{grid-template-columns:1fr}.g-4{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.g-3{grid-template-columns:1fr}}
.stack>*+*{margin-top:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2,.card h3{margin:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h2{font:600 19px/1.2 var(--f-display);letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h2{font:600 30px/1.05 var(--f-display);letter-spacing:-.025em;margin:4px 0 0}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--accent);color:#f3eee4;border:0}
:root[data-theme="dark"] .hero{background:#1c3b2d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1c3b2d}}
.hero::after{content:"₹";position:absolute;right:-18px;bottom:-70px;font:700 260px/1 var(--f-display);opacity:.08;pointer-events:none}
.hero .eyebrow{color:rgba(243,238,228,.7)}
.big{font:600 clamp(36px,6vw,54px)/1 var(--f-display);letter-spacing:-.03em;margin:10px 0 6px}
.hero-split{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid rgba(243,238,228,.18)}
.hero-split div{min-width:110px}
.hero-split b{display:block;font:500 15px var(--f-mono)}
.hero-split span{font-size:12px;opacity:.75;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

/* stats */
.stat .v{font:600 22px/1.15 var(--f-mono);letter-spacing:-.02em;margin-top:8px}
.stat .d{font-size:12.5px;color:var(--ink-2);margin-top:4px}

/* progress */
.bar{height:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{flex:none}
.ring circle{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-family:var(--f-mono)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-done{background:var(--accent-soft);color:var(--good)}
.p-progress{background:var(--warn-soft);color:var(--warn)}
.p-planned{background:var(--accent-2-soft);color:var(--accent-2)}
.p-todo{background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line)}
.p-bad{background:var(--bad-soft);color:var(--bad)}

/* steps */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.steps li:first-child{border-top:0;padding-top:2px}
.stepn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono);border:1.5px solid var(--line);color:var(--ink-2)}
.stepn.done{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.stepn.progress{border-color:var(--warn);color:var(--warn)}
.steps .t{font-weight:600}
.steps .n{font-size:12.5px;color:var(--ink-2)}

/* events */
.events{list-style:none;margin:0;padding:0}
.events li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line);align-items:center}
.events li:first-child{border-top:0;padding-top:0}
.cal{border:1px solid var(--line);border-radius:10px;text-align:center;overflow:hidden;background:var(--paper-2)}
.cal b{display:block;font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-2);color:#fff;padding:4px 0}
.cal span{display:block;font:600 18px/1.4 var(--f-display)}
.events .t{font-weight:600;font-size:14px}
.events .n{font-size:12.5px;color:var(--ink-2)}

/* chart */
.chart-wrap{overflow-x:auto;margin:0 -4px}
.chart{display:block;width:100%;min-width:560px;height:auto}
.chart text{font:10.5px var(--f-mono);fill:var(--ink-3)}
.chart .grid-l{stroke:var(--line);stroke-dasharray:2 3}
.chart .col:hover rect.seg{filter:brightness(1.12)}
.chart .col .hit{fill:transparent}
.chart .col:hover .hit{fill:var(--paper-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;max-width:240px}
.tip.on{opacity:1}
.tip b{font-family:var(--f-mono)}

/* tables */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px dashed var(--line);vertical-align:middle;white-space:nowrap}
td.r,th.r{text-align:right}
tr.total td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:600}
tr.muted td{color:var(--ink-3)}
tr.now td{background:var(--accent-soft)}
td input,td select{width:100%;min-width:80px}

/* log */
.month{padding:0;overflow:hidden}
.month-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:var(--paper-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.month-h .h2{font-size:18px}
.month-h .meta{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);align-items:center;flex-wrap:wrap}
.month-h .meta b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px dashed var(--line)}
.entry:first-of-type{border-top:0}
.entry .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.entry .note{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.entry .fdm{font:12px var(--f-mono);color:var(--ink-3);margin-top:3px}
.entry .amt{font:600 15px var(--f-mono)}
.row-actions{display:flex;gap:4px}
.row-actions button{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:6px;border-radius:8px}
.row-actions button:hover{background:var(--paper-2);color:var(--ink)}
@media (max-width:520px){.entry{grid-template-columns:1fr auto}.entry .row-actions{grid-column:1/-1;justify-content:flex-end;margin-top:-6px}}

/* forms */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
input[type=text],input[type=number],input[type=month],input[type=date],input[type=password],select,textarea{
  background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=color]{width:40px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);padding:3px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{width:auto}
.fab{display:none}
@media (max-width:820px){.fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:31;width:54px;height:54px;border-radius:16px;border:0;background:var(--accent-2);color:#fff;box-shadow:0 10px 24px -8px rgba(194,98,45,.6);cursor:pointer}}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty .h2{margin-bottom:6px}
.note-box{font-size:12.5px;color:var(--ink-2);background:var(--paper-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.warn-box{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px}

/* dialog */
dialog{border:0;padding:0;border-radius:18px;background:var(--paper);color:var(--ink);width:min(560px,calc(100vw - 24px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(17,23,20,.45);backdrop-filter:blur(3px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.dlg-b{padding:16px 20px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}
.fd-only{display:contents}
.fd-only[hidden]{display:none}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:min(400px,100%);padding:28px}
.login h1{font:600 30px/1.05 var(--f-display);letter-spacing:-.025em;margin:6px 0 4px}
.login h1 em{color:var(--accent);font-weight:400}
.err{color:var(--bad);font-size:13px;min-height:18px}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip"></div>

<dialog id="dlg">
  <form id="entryForm" method="dialog">
    <div class="dlg-h"><div><div class="eyebrow">Monthly log</div><div class="h2" id="dlgTitle">Add saving</div></div>
      <button type="button" class="iconbtn" data-action="close" aria-label="Close">✕</button></div>
    <div class="dlg-b">
      <div class="form-grid">
        <div class="field"><label for="f_month">Month</label><input type="month" id="f_month" required></div>
        <div class="field"><label for="f_bucket">Where</label><select id="f_bucket"></select></div>
        <div class="field full"><label for="f_amount">Amount (₹)</label><input type="number" id="f_amount" min="1" step="1" inputmode="numeric" required placeholder="e.g. 50000"></div>
        <div class="field full"><label for="f_note">Note</label><input type="text" id="f_note" placeholder="e.g. FD #2 — HDFC 1 year"></div>
        <div class="fd-only" id="fdFields">
          <div class="field"><label for="f_bank">Bank</label><input type="text" id="f_bank" placeholder="HDFC / SBI / ICICI"></div>
          <div class="field"><label for="f_maturity">Maturity date</label><input type="date" id="f_maturity"></div>
        </div>
      </div>
    </div>
    <div class="dlg-f">
      <button type="button" class="btn" data-action="close">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
'use strict';

/* ================= utils ================= */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const inr=n=>(n<0?'-':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';
  if(a>=1e7)return s+'₹'+trim(a/1e7)+' Cr'; if(a>=1e5)return s+'₹'+trim(a/1e5)+' L'; if(a>=1e3)return s+'₹'+trim(a/1e3)+'k'; return s+'₹'+Math.round(a)};
const trim=x=>(Math.round(x*100)/100).toString();
const pct=(a,b)=>b>0?Math.max(0,Math.min(100,a/b*100)):0;
const ym=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const addM=(m,n)=>{let[y,mo]=m.split('-').map(Number);const t=y*12+(mo-1)+n;return `${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`};
const mDiff=(a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by*12+bm)-(ay*12+am)};
const mLabel=m=>{if(!m)return '—';const[y,mo]=m.split('-');return `${MONTHS[+mo-1]} ${y}`};
const dLabel=d=>{if(!d)return '—';const x=new Date(d+'T00:00:00');return isNaN(x)?'—':`${String(x.getDate()).padStart(2,'0')} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`};
const daysTo=d=>{const x=new Date(d+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);return Math.round((x-t)/864e5)};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

/* ================= seed (empty) ================= */
const SEED=()=>({
  version:1,
  settings:{salary:0,fdMultiplier:4,sipMonthly:0,fdStart:ym(),sipStart:ym(),fdPlanMonths:12,sipPlanMonths:12},
  buckets:[

function normalize(d){
  const s=SEED(); d=d&&typeof d==='object'?d:{};
  return {
    ...s,...d,
    settings:{...s.settings,...(d.settings||{})},
    buckets:Array.isArray(d.buckets)&&d.buckets.length?d.buckets:s.buckets,
    entries:Array.isArray(d.entries)?d.entries:s.entries,
    steps:Array.isArray(d.steps)?d.steps:s.steps,
    sip:{...s.sip,...(d.sip||{}),funds:Array.isArray(d.sip?.funds)?d.sip.funds:s.sip.funds},
    insurance:{life:{...s.insurance.life,...(d.insurance?.life||{})},health:{...s.insurance.health,...(d.insurance?.health||{})}}
  };
}

/* ================= server sync ================= */
const KEY_PW='ffp:key', KEY_CACHE='ffp:cache', KEY_TAB='ffp:tab', KEY_THEME='ffp:theme';
let S=null, syncState='ok', syncMsg='Saved', saveTimer=null, storageKind='';
async function api(method,body){
  const r=await fetch('/api/data',{method,headers:{'content-type':'application/json','x-app-key':lsGet(KEY_PW)||''},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  let j={}; try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e}
  return j;
}
function setSync(s,msg){syncState=s;syncMsg=msg;const el=$('#sync');if(el){el.dataset.s=s;el.lastChild.textContent=msg}}
function save(){
  lsSet(KEY_CACHE,JSON.stringify(S));
  setSync('saving','Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,500);
}
async function flush(){
  try{const r=await api('PUT',{data:S});S.updatedAt=r.updatedAt;lsSet(KEY_CACHE,JSON.stringify(S));setSync('ok','Saved');}
  catch(e){if(e.status===401){logout('Session expired — enter password again.');return}
    setSync('error','Not saved — retrying');clearTimeout(saveTimer);saveTimer=setTimeout(flush,5000);}
}
window.addEventListener('beforeunload',e=>{if(syncState!=='ok'){e.preventDefault();e.returnValue=''}});

async function boot(){
  applyTheme();
  if(!lsGet(KEY_PW))return renderLogin();
  $('#app').innerHTML='<div class="loading">Loading your plan…</div>';
  try{
    const r=await api('GET'); storageKind=r.storage||'';
    if(r.data){S=normalize(r.data)}
    else{S=SEED();await api('PUT',{data:S})}
    lsSet(KEY_CACHE,JSON.stringify(S));
    renderShell();
  }catch(e){
    if(e.status===401)return logout('Wrong password.');
    if(e.status===500&&/APP_PASSWORD/.test(e.message))return renderLogin(e.message);
    const cached=lsGet(KEY_CACHE);
    if(cached){S=normalize(JSON.parse(cached));renderShell();setSync('error','Offline — showing last copy');}
    else renderLogin('Cannot reach server: '+e.message);
  }
}
function logout(msg){lsSet(KEY_PW,null);renderLogin(msg)}

function renderLogin(msg=''){
  $('#app').innerHTML=`<div class="login"><form class="card" id="loginForm">
    <div class="eyebrow">Personal savings ledger</div>
    <h1>Full Feature <em>Plan</em></h1>
    <p class="sub" style="margin:0 0 18px">Enter your app password to open your plan.</p>
    <div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required autofocus></div>
    <div class="err" style="margin:8px 0">${esc(msg)}</div>
    <button class="btn primary" style="width:100%;justify-content:center">Open</button>
  </form></div>`;
  $('#loginForm').addEventListener('submit',e=>{e.preventDefault();lsSet(KEY_PW,$('#pw').value);boot()});
}

/* ================= derived numbers ================= */
const bucket=id=>S.buckets.find(b=>b.id===id)||{id,name:id,color:'#888'};
const fdTarget=()=>num(S.settings.salary)*num(S.settings.fdMultiplier);
const bucketTarget=b=>b.id==='fd'?fdTarget():num(b.target);
const sumBucket=(id,upto)=>S.entries.reduce((a,e)=>a+((e.bucket===id&&(!upto||e.month<=upto))?num(e.amount):0),0);
const sumMonth=m=>S.entries.reduce((a,e)=>a+(e.month===m?num(e.amount):0),0);
const sipInvested=()=>sumBucket('sip');
const sipValue=()=>num(S.sip.currentValue)>0?num(S.sip.currentValue):sipInvested();
function totals(){
  const by={};S.buckets.forEach(b=>by[b.id]=sumBucket(b.id));
  by.sip=sipValue();
  const total=Object.values(by).reduce((a,b)=>a+b,0);
  return {by,total};
}
const sortedEntries=()=>[...S.entries].sort((a,b)=>b.month.localeCompare(a.month)||(b.ts||0)-(a.ts||0));
function stepProgress(st){
  if(st.link){const b=bucket(st.link);const t=bucketTarget(b);return {saved:sumBucket(st.link),target:t}}
  return {saved:null,target:num(st.target)};
}
function fdPlan(){
  const t=fdTarget(), saved=sumBucket('fd'), need=Math.max(0,t-saved);
  const deadline=addM(S.settings.fdStart,num(S.settings.fdPlanMonths)-1);
  const cur=ym();
  let monthsLeft = cur<S.settings.fdStart ? mDiff(S.settings.fdStart,deadline)+1 : mDiff(cur,deadline);
  monthsLeft=Math.max(1,monthsLeft);
  return {t,saved,need,deadline,monthsLeft,perMonth:need/monthsLeft};
}
function events(){
  const ev=[], ins=S.insurance;
  if(ins.life.renewal)ev.push({d:ins.life.renewal,t:'Life insurance renewal',n:`${ins.life.policy||'Policy'} · premium ${inr(num(ins.life.premium))}`});
  if(!ins.health.bought&&ins.health.planMonth)ev.push({d:ins.health.planMonth+'-01',t:'Buy health insurance',n:`Cover ${short(num(ins.health.cover))} + super top-up ${short(num(ins.health.superTopUp))}`,m:true});
  if(ins.health.bought&&ins.health.renewal)ev.push({d:ins.health.renewal,t:'Health insurance renewal',n:`${ins.health.company||'Policy'} · premium ${inr(num(ins.health.premium))}`});
  const p=fdPlan(); if(p.t>0&&p.need>0)ev.push({d:p.deadline+'-01',t:'Emergency FD target date',n:`${short(p.need)} still needed`,m:true});
  if(sipInvested()===0&&num(S.settings.sipMonthly)>0)ev.push({d:S.settings.sipStart+'-01',t:'Start SIP',n:`${inr(num(S.settings.sipMonthly))}/month`,m:true});
  S.entries.filter(e=>e.bucket==='fd'&&e.fd?.maturity).forEach(e=>ev.push({d:e.fd.maturity,t:`FD matures${e.fd.bank?' — '+e.fd.bank:''}`,n:inr(num(e.amount))}));
  return ev.filter(x=>daysTo(x.d)>=-31).sort((a,b)=>a.d.localeCompare(b.d));
}

  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-p/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font:600 22px var(--f-display);fill:var(--ink)">${Math.round(p)}%</text></svg>`;
}

function chartMonths(){
  const ms=S.entries.map(e=>e.month).sort();
  let start=ms[0]&&ms[0]<S.settings.fdStart?ms[0]:S.settings.fdStart;
  let end=[ym(),ms[ms.length-1]||ym()].sort()[1];
  if(mDiff(start,end)<11)end=addM(start,11);
  if(mDiff(start,end)>35)start=addM(end,-35);
  const out=[];for(let m=start;m<=end;m=addM(m,1))out.push(m);return out;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function chartSVG(){
  const months=chartMonths(),W=760,H=270,pl=54,pr=10,pt=14,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  const data=months.map(m=>{const per=S.buckets.map(b=>({b,v:S.entries.filter(e=>e.month===m&&e.bucket===b.id).reduce((a,e)=>a+num(e.amount),0)}));return {m,per,total:per.reduce((a,x)=>a+x.v,0)}});
  const max=niceMax(Math.max(1000,...data.map(d=>d.total)));
  const bw=iw/months.length,barW=Math.min(30,bw*.6),cur=ym();
  let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+3.5}" text-anchor="end">${short(max*i/4)}</text>`}
  data.forEach((d,i)=>{
    const x=pl+bw*i+(bw-barW)/2;let y=pt+ih;
    let segs='';d.per.forEach(({b,v})=>{if(!v)return;const h=Math.max(1.5,v/max*ih);y-=h;segs+=`<rect class="seg" x="${x}" y="${y}" width="${barW}" height="${h}" fill="${b.color}" rx="2"/>`});
    const [yy,mo]=d.m.split('-');const lbl=MONTHS[+mo-1]+((+mo===1||i===0)?" '"+yy.slice(2):'');
    const showLbl=months.length<=18||i%2===0;
    const tip=`<b>${mLabel(d.m)}</b> · ${inr(d.total)}`+d.per.filter(x=>x.v).map(x=>`<br>${esc(x.b.name)}: ${inr(x.v)}`).join('');
    g+=`<g class="col" data-tip="${esc(tip)}"><rect class="hit" x="${pl+bw*i+1}" y="${pt}" width="${bw-2}" height="${ih}" rx="6"/>${segs}
      ${showLbl?`<text x="${x+barW/2}" y="${H-12}" text-anchor="middle" ${d.m===cur?'style="fill:var(--accent);font-weight:600"':''}>${lbl}</text>`:''}</g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly savings by bucket">${g}</svg>`;
}

function vFD(){

const dlg=$('#dlg'); let editingId=null;
function openEntry(opts={}){
  const e=opts.id?S.entries.find(x=>x.id===opts.id):null; editingId=e?e.id:null;
  $('#dlgTitle').textContent=e?'Edit saving':'Add saving';
  $('#f_bucket').innerHTML=S.buckets.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  $('#f_month').value=e?.month||opts.month||ym();
  $('#f_bucket').value=e?.bucket||opts.bucket||'fd';
  $('#f_amount').value=e?num(e.amount):(opts.amount||'');
  $('#f_note').value=e?.note||'';
  $('#f_bank').value=e?.fd?.bank||''; $('#f_maturity').value=e?.fd?.maturity||'';
  toggleFD(); dlg.showModal(); setTimeout(()=>$('#f_amount').focus(),50);
}
function toggleFD(){$('#fdFields').hidden=$('#f_bucket').value!=='fd'}
$('#f_bucket').addEventListener('change',toggleFD);
$('#entryForm').addEventListener('submit',ev=>{
  ev.preventDefault();
  const amount=num($('#f_amount').value), month=$('#f_month').value;
  if(!month||amount<=0){$('#f_amount').focus();return}
  const bucketId=$('#f_bucket').value;
  const data={month,bucket:bucketId,amount,note:$('#f_note').value.trim(),
    fd:bucketId==='fd'?{bank:$('#f_bank').value.trim(),maturity:$('#f_maturity').value}:null};
  if(editingId){Object.assign(S.entries.find(x=>x.id===editingId),data)}
  else S.entries.push({id:uid(),ts:Date.now(),...data});
  dlg.close(); save(); render();
});

/* ================= events ================= */
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-action]'); if(!a)return;
  const act=a.dataset.action,id=a.dataset.id;
  switch(act){
    case 'tab': tab=id; lsSet(KEY_TAB,id); render(); window.scrollTo({top:0}); break;
    case 'add': openEntry({month:a.dataset.month,bucket:a.dataset.bucket,amount:a.dataset.amount}); break;
    case 'edit': openEntry({id}); break;
    case 'del': {const e=S.entries.find(x=>x.id===id); if(e&&confirm(`Delete ${inr(num(e.amount))} (${bucket(e.bucket).name}, ${mLabel(e.month)})?`)){S.entries=S.entries.filter(x=>x.id!==id);save();render()} break;}
    case 'close': dlg.close(); break;
    case 'theme': {const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');lsSet(KEY_THEME,cur==='dark'?'light':'dark');applyTheme();break;}
    case 'add-fund': S.sip.funds.push({name:'New fund',share:0}); save(); render(); break;
    case 'del-fund': S.sip.funds.splice(+id,1); save(); render(); break;
    case 'add-bucket': {const colors=['#8a6d3b','#7a4f8a','#2f7f86','#a0453c','#5c6b2f'];S.buckets.push({id:'b'+uid(),name:'New bucket',color:colors[S.buckets.length%colors.length],target:0});save();render();break;}
    case 'del-bucket': {const n=S.entries.filter(e=>e.bucket===id).length; if(n){alert(`This bucket has ${n} entr${n>1?'ies':'y'}. Move or delete them first.`);break} S.buckets=S.buckets.filter(b=>b.id!==id);save();render();break;}
    case 'export-json': download(`full-feature-plan-${ym()}.json`,JSON.stringify(S,null,2),'application/json'); break;
    case 'export-csv': exportCSV(); break;
    case 'logout': lsSet(KEY_PW,null); lsSet(KEY_CACHE,null); renderLogin(); break;
    case 'reset': if(confirm('Delete ALL data (entries, insurance, settings)? Download a JSON backup first if unsure.')){S=SEED();save();render()} break;
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.bind){
    let v=el.value; if(el.dataset.type==='num')v=num(v); if(el.dataset.type==='bool')v=v==='true';
    setPath(el.dataset.bind,v);
    if(el.dataset.bind==='sip.currentValue')S.sip.valueDate=new Date().toISOString().slice(0,10);
    save(); render(); return;
  }
  if(el.dataset.filter){logFilter[el.dataset.filter]=el.value;render();return}
  if(el.id==='importFile'&&el.files[0]){
    el.files[0].text().then(t=>{const d=JSON.parse(t);if(!d||!Array.isArray(d.entries))throw new Error('Not a plan backup');
      if(confirm('Replace current data with this backup?')){S=normalize(d);save();render()}}).catch(e=>alert('Could not restore: '+e.message));
  }
});
document.addEventListener('pointermove',ev=>{
  const g=ev.target.closest&&ev.target.closest('[data-tip]'),tip=$('#tip');
  if(!g){tip.classList.remove('on');return}
  tip.innerHTML=g.dataset.tip; tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=ev.clientX+14,y=ev.clientY-h-10; if(x+w>innerWidth-8)x=ev.clientX-w-14; if(y<8)y=ev.clientY+16;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
document.addEventListener('scroll',()=>$('#tip').classList.remove('on'),{passive:true});

function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(){
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[['Month','Bucket','Amount','Note','Bank','Maturity']];
  [...S.entries].sort((a,b)=>a.month.localeCompare(b.month)).forEach(e=>rows.push([mLabel(e.month),bucket(e.bucket).name,num(e.amount),e.note,e.fd?.bank,e.fd?.maturity]));
  download(`full-feature-plan-${ym()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
}

  const dark=t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.querySelector('meta[name=theme-color]').content=dark?'#111714':'#f3eee4'}

boot();
